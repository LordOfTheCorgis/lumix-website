slug: "terraria"
label: "Terraria Server Hosting"
shortLabel: "Terraria"
status: "live"
tagline: "Small worlds, steady tick rate, no fuss."
description: "Tuned for vanilla and lightly modded Terraria worlds. Sized for friend groups rather than public servers, and priced accordingly."
logo: "../../assets/logos/terraria.webp"
image: "../../assets/games/terraria.jpg"
accent: "#22d3ee"
mark: "TR"
highlights:
  - "tModLoader supported"
  - "Daily backups included"
plans:
  # pid 14 was the only terraria product, it becomes starter. specs and
  # prices untouched so nobody on it gets a surprise. annual at 48 is already
  # under the 90% curve so it stays
  - key: "starter"
    name: "Starter Terraria Server"
    pid: 14
    specs:
      vcores: "2"
      ramGb: "2"
      storageGb: "15"
      slots: "Unmetered"
      databases: "1"
      backups: "3"
    pricing:
      monthly: 5.0
      quarterly: 13.99
      semiannually: 27.0
      annually: 48.0
  # everything below needs a WHMCS product first. schema wants a real pid
  # (wrong pid = wrong product in the cart), so these stay commented until
  # the numbers exist. fill pid, uncomment, done.
  #
  # terraria's server loop is basically one thread, so past ~3 cores you're
  # paying for ram and disk, not speed. ram is what tModLoader + calamity
  # actually eat, that's why the ladder is ram-led. standard (4G) is where a
  # modded world with a few friends stops stuttering, hence popular
  #
  # term prices are the 95/92/90/85/80 curve, rounded to nearest .99
