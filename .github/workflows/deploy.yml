name: Deploy to server

# manual only. the secrets this uses point at the wrong box (per evan,
# 2026-09-23) and the redesign isn't going live yet. don't put a push trigger
# back until the target is fixed and evan says ship it
on:
  workflow_dispatch:

# two pushes close together shouldn't rsync over each other
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    # belt and braces: even a manual run does nothing until this goes true
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci not install, so the build uses the lockfile and not whatever npm feels like today
      - name: Install dependencies
        run: npm ci

      # .env never reaches CI. without these the build ships with analytics
      # and the cookie banner silently off. they're PUBLIC_ keys, they end up
      # in the page source anyway, so repo variables not secrets
      - name: Build project
        run: npm run build
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/srv/www/lumixsolutions.org/
