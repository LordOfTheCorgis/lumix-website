name: Deploy to production

# Every push to main builds the site and uploads it to lumixsolutions.org on
# cPanel over FTPS. Same shape as deploy-dev.yml on redesign (FTPS, the same
# FTP-Deploy action, upload skipped until the secrets exist) and the SAME
# CPANEL_FTP_* secrets and account as dev.
#
# That only works if the account's home is public_html. Today the account is
# jailed to public_html/dev.lumixsolutions.org (per deploy-dev.yml, checked
# 2026-10-08), and "../" can't escape a jail: the prod build would land in the
# dev site instead. So:
#   1. cPanel > FTP Accounts > change the account's Directory to public_html.
#   2. In the SAME breath, deploy-dev.yml on redesign must change its
#      server-dir from ./ to ./dev.lumixsolutions.org/ . Skip that and the next
#      redesign push uploads the noindex dev build over the LIVE site.
# The guard step below refuses to upload while the account is still jailed
# (its root wouldn't list a dev.lumixsolutions.org folder), so running this
# early fails loudly instead of overwriting the dev site.
#
# Why the dev. folder next to the site survives:
#   - nothing is ever cleaned: the action only deletes files it uploaded
#     itself on an earlier run (tracked in its own state file, named
#     differently from dev's), and dangerous-clean-slate is pinned to false.
#   - the build can't produce a dev.lumixsolutions.org folder, and a check
#     step fails the run if one ever shows up in dist/.
# Manual runs default to a DRY RUN that only logs what would change. Untick
# dry_run to upload for real.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log what would be uploaded, change nothing"
        type: boolean
        default: true

# two pushes close together shouldn't upload over each other, and cancelling
# a half-finished FTP upload is worse than just waiting
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FTP: ${{ secrets.CPANEL_FTP_SERVER != '' && secrets.CPANEL_FTP_USERNAME != '' && secrets.CPANEL_FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No build env: on main, noindex is a per-page prop in Layout.astro, not
      # driven by PUBLIC_DEPLOY_ENV, so prod builds and indexes normally.
      - name: Build
        run: npm run build

      - name: Make sure dist/ can't touch the dev site
        run: |
          if [ -e "dist/dev.lumixsolutions.org" ]; then
            echo "::error::dist/ contains dev.lumixsolutions.org, refusing to upload"
            exit 1
          fi

      - name: Check the FTP account lands in public_html, not the dev folder
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          listing=$(curl -sS --ftp-ssl-reqd --insecure --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER/")
          if ! printf '%s\n' "$listing" | grep -qx 'dev.lumixsolutions.org'; then
            echo "::error::FTP root has no dev.lumixsolutions.org folder, so this account is still jailed to the dev site. Uploading now would overwrite the dev site with the prod build. Change the account's directory to public_html in cPanel first (and update deploy-dev.yml, see the comment at the top)."
            exit 1
          fi

      - name: Upload to cPanel
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          # FTPS so the password doesn't cross the internet in the clear.
          protocol: ftps
          # web-srv-02's FTP cert is self-signed (CN=web-srv-02), so strict
          # verification fails on any hostname. "loose" keeps it encrypted.
          security: loose
          local-dir: ./dist/
          # Relative to the FTP account's own root. Once the account's
          # directory is public_html that root IS the live docroot (the guard
          # step above checks exactly that).
          server-dir: ./
          # Its own state file so it can never be confused with dev's.
          state-name: .ftp-deploy-sync-state-prod.json
          # Belt and braces: never wipe the target before uploading.
          dangerous-clean-slate: false
          # Manual runs are dry by default; pushes upload for real.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Say why nothing was uploaded
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Built fine, skipped the upload. Add the CPANEL_FTP_* secrets to deploy."
