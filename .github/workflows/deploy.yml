name: Deploy to production

# Every push to main builds the site and uploads it to lumixsolutions.org on
# cPanel over FTPS. Same shape as deploy-dev.yml on redesign (FTPS, the same
# FTP-Deploy action, upload skipped until the secrets exist), but with its OWN
# FTP account, so nothing about dev's account or workflow has to change:
#
#   cPanel > FTP Accounts: an account whose Directory is `public_html` (the
#   live docroot). Repo secrets (Settings > Secrets and variables > Actions):
#     CPANEL_FTP_PROD_USERNAME   the FULL name, e.g. deploy-main@lumixsolutions.org
#     CPANEL_FTP_PROD_PASSWORD
#   CPANEL_FTP_SERVER is the same host dev uses (dev.lumixsolutions.org, not ftp.).
#   Do NOT put the prod account into the dev secrets (CPANEL_FTP_USERNAME/
#   CPANEL_FTP_PASSWORD): dev uploads to its account root, so the next redesign push would
#   drop the noindex dev build over the live site.
#
# Guard: before uploading, the run lists the account's root and refuses to go on
# unless a dev.lumixsolutions.org folder is in it. That proves the account lands
# in public_html and not inside the dev site.
#
# Why the dev. folder next to the site survives:
#   - nothing is ever cleaned: the action only deletes files it uploaded
#     itself on an earlier run (tracked in its own state file, named
#     differently from dev's), and dangerous-clean-slate is pinned to false.
#   - the build can't produce a dev.lumixsolutions.org folder, and a check
#     step fails the run if one ever shows up in dist/.
# Manual runs default to a DRY RUN that only logs what would change. Untick
# dry_run to upload for real.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: log what would be uploaded, change nothing"
        type: boolean
        default: true

# two pushes close together shouldn't upload over each other, and cancelling
# a half-finished FTP upload is worse than just waiting
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FTP: ${{ secrets.CPANEL_FTP_SERVER != '' && secrets.CPANEL_FTP_PROD_USERNAME != '' && secrets.CPANEL_FTP_PROD_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No build env: on main, noindex is a per-page prop in Layout.astro, not
      # driven by PUBLIC_DEPLOY_ENV, so prod builds and indexes normally.
      - name: Build
        run: npm run build

      - name: Make sure dist/ can't touch the dev site
        run: |
          if [ -e "dist/dev.lumixsolutions.org" ]; then
            echo "::error::dist/ contains dev.lumixsolutions.org, refusing to upload"
            exit 1
          fi

      - name: Check the FTP account lands in public_html, not the dev folder
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_PROD_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PROD_PASSWORD }}
        run: |
          listing=$(curl -sS --ftp-ssl-reqd --insecure --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER/")
          if ! printf '%s\n' "$listing" | grep -qx 'dev.lumixsolutions.org'; then
            echo "::error::FTP root has no dev.lumixsolutions.org folder, so this account is jailed to the dev site (or the secrets are the dev account's). Uploading now would overwrite the dev site with the prod build. Check the prod FTP account's Directory is public_html in cPanel, and that these are the PROD secrets, not the dev ones."
            exit 1
          fi

      - name: Upload to cPanel
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_PROD_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PROD_PASSWORD }}
          # FTPS so the password doesn't cross the internet in the clear.
          protocol: ftps
          # web-srv-02's FTP cert is self-signed (CN=web-srv-02), so strict
          # verification fails on any hostname. "loose" keeps it encrypted.
          security: loose
          local-dir: ./dist/
          # Relative to the FTP account's own root. The prod account's
          # directory is public_html, so its root IS the live docroot (the
          # guard step above checks exactly that).
          server-dir: ./
          # Its own state file so it can never be confused with dev's.
          state-name: .ftp-deploy-sync-state-prod.json
          # Belt and braces: never wipe the target before uploading.
          dangerous-clean-slate: false
          # Manual runs are dry by default; pushes upload for real.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Say why nothing was uploaded
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Built fine, skipped the upload. Add CPANEL_FTP_SERVER plus CPANEL_FTP_PROD_USERNAME and CPANEL_FTP_PROD_PASSWORD (a cPanel FTP account whose directory is public_html) to deploy."
