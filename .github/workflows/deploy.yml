name: Deploy to production

# Every push to main builds the site and uploads it to lumixsolutions.org on
# cPanel over FTPS, the mirror of deploy-dev.yml. Same box, same action, same
# FTP account (the CPANEL_FTP_* secrets dev uses) - the only difference is
# where it lands. Static files only, so cPanel's Node version is irrelevant.
# No build env: on main, noindex is a per-page prop in Layout.astro, not driven
# by PUBLIC_DEPLOY_ENV, so prod builds and indexes normally with a plain build.
#
# Uses the same three repo secrets as the dev workflow:
#   CPANEL_FTP_SERVER    the cPanel host (dev.lumixsolutions.org points at it)
#   CPANEL_FTP_USERNAME  the deploy FTP user
#   CPANEL_FTP_PASSWORD
# Until CPANEL_FTP_SERVER is set the build still runs and the upload is skipped,
# so a push never fails just because the secrets aren't wired yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

# two pushes close together shouldn't upload over each other
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_FTP: ${{ secrets.CPANEL_FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to cPanel
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          # FTPS so the password doesn't cross the internet in the clear.
          protocol: ftps
          # web-srv-02's FTP cert is self-signed, so strict verification fails.
          # "loose" keeps it encrypted and skips the cert check.
          security: loose
          local-dir: ./dist/
          # The shared FTP account lands in public_html/dev.lumixsolutions.org
          # (that's where dev's "./" goes). The live docroot is its parent, so
          # main goes up one level into public_html. FTP-Deploy only manages
          # files it uploaded, so the dev. subfolder sitting right next to this
          # is left alone.
          #
          # This needs the account to NOT be hard-chrooted to the dev folder -
          # if "../" can't escape, point the cPanel FTP account's directory at
          # public_html instead and change this back to "./".
          server-dir: ../

      - name: Say why nothing was uploaded
        if: env.HAS_FTP != 'true'
        run: echo "::notice::Built fine, skipped the upload. Set the CPANEL_FTP_* secrets to deploy."
